<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Equipment Tracker Crew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: white logo band, Conti-green livery band with cream pinstripes holding the tabs; big machine left, attachment boxes right */
:root{
  --ground:#F5F1E6; --panel:#FFFFFF; --panel-2:#EDE4CB; --ink:#1D1D1B; --ink-2:#5E6058; --rule:#E0D7BE;
  --livery:#003F23; --cream:#E6DCC0; --tan:#E6DCC0; --tan-2:#D9CCA6; --maroon:#6A0437;
  --brand:#003F23; --brand-ink:#FFFFFF; --iron:#0B4A2B; --iron-2:#06331D; --glass:#B9CCC2; --steel:#2B302D; --steel-2:#4E5550;
  --fit:#1F7A45; --fit-bg:#DDEFE3; --adp:#2F6DB5; --adp-bg:#DFE8F5; --no:#6A0437; --no-bg:#F3DDE6; --unk:#7A7F79; --unk-bg:#E9E8E2;
  --warn:#8A5A00; --warn-bg:#F8EBC9;
  --f-disp:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#10140F; --panel:#181E19; --panel-2:#232A22; --ink:#EDE8DA; --ink-2:#ABA996; --rule:#323A30; --tan:#3A3828; --tan-2:#4A4632;
  --brand:#5DB386; --brand-ink:#0F1411; --iron:#2E7A52; --iron-2:#205C3C; --glass:#6C8A7B; --steel:#0A0D0B; --steel-2:#323A34;
  --fit:#6FCB93; --fit-bg:#1D3A28; --adp:#7FB0EA; --adp-bg:#1E2F45; --no:#E58FB0; --no-bg:#3D1C29; --unk:#8D938C; --unk-bg:#262D28;
  --warn:#F2C25B; --warn-bg:#3A2F16; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#10140F; --panel:#181E19; --panel-2:#232A22; --ink:#EDE8DA; --ink-2:#ABA996; --rule:#323A30; --tan:#3A3828; --tan-2:#4A4632;
  --brand:#5DB386; --brand-ink:#0F1411; --iron:#2E7A52; --iron-2:#205C3C; --glass:#6C8A7B; --steel:#0A0D0B; --steel-2:#323A34;
  --fit:#6FCB93; --fit-bg:#1D3A28; --adp:#7FB0EA; --adp-bg:#1E2F45; --no:#E58FB0; --no-bg:#3D1C29; --unk:#8D938C; --unk-bg:#262D28;
  --warn:#F2C25B; --warn-bg:#3A2F16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:.01em}
.mono,.tag{font-family:var(--f-mono);font-weight:600;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.mcard:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.logoband{background:var(--cream)}
.logoband .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logoband img{height:34px;width:auto;display:block}
.logoband .div{width:1px;align-self:stretch;background:#B8AB86}
.logoband .t{font-family:var(--f-disp);color:#1D1D1B;line-height:1.1}
.logoband .t b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.mode{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.08em;border-radius:4px;padding:2px 7px;vertical-align:4px;margin-left:6px}
.mode.edit{background:#6A0437;color:#fff}
.mode.crew{background:#003F23;color:#E6DCC0}
.logoband .t span{font-family:var(--f-body);font-size:13px;color:#5A5640;font-weight:500}
.livery{background:var(--livery);border-top:3px solid var(--livery);box-shadow:inset 0 2px 0 var(--cream), inset 0 -6px 0 var(--livery), inset 0 -8px 0 var(--cream)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav.tabs button{background:none;border:0;padding:12px 16px 16px;font-family:var(--f-disp);font-size:15px;font-weight:600;letter-spacing:.01em;color:#C9D6CE;border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#FFFFFF;border-bottom-color:var(--cream)}
nav.tabs button:hover{color:#FFFFFF}
main{padding-block:20px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar h2{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);padding:8px 14px;border-radius:6px;font-weight:600;font-size:14px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:none}
.btn.danger{color:var(--no);border-color:var(--no)}
.btn.small{padding:5px 10px;font-size:13px}
.note{color:var(--ink-2);font-size:13px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:14px}

/* machine strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}

.mcard{scroll-snap-align:start;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mcard[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;background:var(--tan)}
.mcard[aria-pressed="true"] .unit{color:var(--brand)}
.mcard .iron{height:54px;width:100%}
.mcard .unit{font-family:var(--f-mono);font-weight:500;font-size:15px}
.mcard .mm{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .cls{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.mcard.add{align-items:center;justify-content:center;border-style:dashed;color:var(--ink-2);min-height:150px;font-weight:600}

/* machine detail */
.detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;margin-top:20px;align-items:start}
@media (max-width:860px){.detail{grid-template-columns:minmax(0,1fr)}}
.spec{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px;position:sticky;top:calc(130px + env(safe-area-inset-top,0px))}
@media (max-width:860px){.spec{position:static}}
.spec .stage{background:var(--tan);border-radius:8px;padding:18px 8px 6px;margin:-4px -4px 14px}
.spec .iron{width:100%;height:auto;display:block}
.spec .counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.spec .counts div{background:var(--panel-2);border-radius:6px;padding:8px 10px}
.spec .counts b{display:block;font-family:var(--f-disp);font-size:26px;line-height:1}
.spec .counts span{font-size:12px;color:var(--ink-2)}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.box{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.box.Y{border-left:4px solid var(--fit)} .box.A{border-left:4px solid var(--adp)} .box.S{border-left:4px dashed var(--adp)} .box.N{opacity:.75}
.box .top{display:flex;gap:10px;align-items:center}
.box .ico{background:var(--panel-2);border-radius:6px;padding:3px}
.box .ico{width:44px;height:36px;flex:none}
.box .tag{font-weight:500;font-size:14px}
.box .what{font-weight:600;line-height:1.2}
.box .size{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.box .loc{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600}
.box .loc svg{width:14px;height:14px;flex:none;color:var(--ink-2)}
.box .loc.none{color:var(--ink-2);font-weight:400}
.box .who{font-size:12px;color:var(--ink-2)}
.box .seg{align-self:flex-start;margin-top:2px}
.pickbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.pickbar h2{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.spec h3{font-size:30px;font-weight:600;line-height:1}
.spec .sub{color:var(--ink-2);margin-bottom:10px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:14px}
dl.kv dt{color:var(--ink-2)}
dl.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.group{margin-bottom:18px}
.group>h4{font-family:var(--f-disp);font-size:16px;font-weight:700;letter-spacing:0;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.group>h4 .n{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-weight:400}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.list{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .ico{width:40px;height:32px;color:var(--ink)}
.row .t{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;min-width:0}
.row .tag{font-weight:500}
.row .what{font-weight:600}
.row .meta{font-size:12.5px;color:var(--ink-2);width:100%}
.row .warns{display:flex;flex-wrap:wrap;gap:4px;width:100%;margin-top:3px}
.w{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:1px 8px;border-radius:4px;font-weight:600}
.sug{background:var(--adp-bg);color:var(--adp);font-size:12px;padding:1px 8px;border-radius:4px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;font-family:var(--f-mono);font-weight:500;font-size:13px;min-width:36px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[data-on="Y"]{background:var(--fit);color:var(--panel)}
.seg button[data-on="A"]{background:var(--adp);color:var(--panel)}
.seg button[data-on="N"]{background:var(--no);color:var(--panel)}
details.more>summary{cursor:pointer;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary h4::after{content:"Show";font-family:var(--f-body);font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-2);margin-left:auto}
details.more[open]>summary h4::after{content:"Hide"}

/* home + machine view */
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.hcard{text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.hcard:hover{border-color:var(--brand)}
.hcard .art{background:var(--tan);padding:16px 10px 6px}
.hcard .art .iron{width:100%;height:110px;display:block}
.hcard .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--livery)}
.hcard .unit{font-family:var(--f-disp);font-weight:800;font-size:21px;letter-spacing:-.02em}
.hcard .mm{color:var(--ink-2);font-size:14px}
.hcard .loc{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--ink-2);margin-top:4px}
.hcard .loc svg{width:13px;height:13px;flex:none}
.hcard .cnt{font-size:13px;font-weight:600;color:var(--brand);margin-top:6px}
.back{background:none;border:0;padding:4px 0;font-weight:600;color:var(--brand);display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.mv{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
@media (max-width:860px){.mv{grid-template-columns:minmax(0,1fr)}}
.mv .left{position:sticky;top:calc(130px + env(safe-area-inset-top,0px))}
@media (max-width:860px){.mv .left{position:static}}
.mv .stage{background:var(--tan);border-radius:12px;padding:28px 12px 10px}
.mv .stage .iron{width:100%;height:auto;display:block}
.mv .stage.hasph{padding:0;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.mv .stage.hasph img,.hcard .art.hasph img{width:100%;height:100%;object-fit:cover;display:block}
.hcard .art.hasph{padding:0;height:136px}
.photo .ph .iron{width:100%;height:auto}
.mv h2.unit{font-family:var(--f-disp);font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:18px}
.mv .mm{font-size:17px;color:var(--ink-2);margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.facts div{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0}
.facts span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.facts b{font-family:var(--f-disp);font-size:17px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:10px}
.rhead h3{font-family:var(--f-disp);font-size:22px;font-weight:800;margin-right:auto}
.rhead .n{font-family:var(--f-mono);color:var(--ink-2)}
.abox{text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;padding:0;min-width:0}
.abox:hover{border-color:var(--brand)}
.abox .ph{aspect-ratio:4/3;max-width:100%;background:var(--panel-2);display:grid;place-items:center;overflow:hidden}
.abox .ph img{width:100%;height:100%;object-fit:cover}
.abox .ph .ico{width:72px;height:60px;color:var(--ink-2)}
.abox .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.abox .tag{font-weight:700;font-size:12.5px;letter-spacing:.04em;color:var(--brand)}
.abox .what{font-weight:700;line-height:1.2}
.abox .desc{font-size:12px;color:var(--ink-2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.abox .size{font-family:var(--f-disp);font-size:19px;font-weight:800;letter-spacing:-.01em}
.abox .loc{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--ink-2)}
.abox .chk{align-self:flex-start;margin-top:4px;font-size:11.5px;font-weight:700;letter-spacing:.03em;background:var(--tan);color:var(--ink);border-radius:4px;padding:1px 7px}
.abox .loc svg{width:13px;height:13px;flex:none}
.photo{display:flex;gap:12px;align-items:center;margin-top:12px}
.photo .ph{width:120px;aspect-ratio:4/3;border-radius:8px;background:var(--panel-2);overflow:hidden;display:grid;place-items:center;flex:none}
.photo .ph img{width:100%;height:100%;object-fit:cover}
.photo .ph .ico{width:56px;height:46px;color:var(--ink-2)}
.photo label.btn input{position:absolute;width:1px;height:1px;opacity:0}
.works{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;min-width:92px}
.works[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.boxes{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
/* attachments */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:9px 12px;font:inherit;color:var(--ink)}
select.f{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:8px 10px;font:inherit;color:var(--ink)}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.acard{text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.acard .ico{width:52px;height:42px}
.acard .thumb{width:52px;height:42px;border-radius:5px;object-fit:cover}
.acard .tag{font-size:15px;font-weight:500}
.acard .what{font-weight:600}
.acard .meta{font-size:12.5px;color:var(--ink-2)}
.acard .fits{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.pill{font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:4px}
.pill.Y{background:var(--fit-bg);color:var(--fit)} .pill.A{background:var(--adp-bg);color:var(--adp)} .pill.unk{background:var(--unk-bg);color:var(--unk)}
.badge-ut{font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--maroon);color:#FFFFFF;border-radius:3px;padding:0 5px;margin-left:6px}

/* grid */
.gridwrap{overflow:auto;border:1px solid var(--rule);border-radius:8px;background:var(--panel);max-height:72vh}
table.g{border-collapse:separate;border-spacing:0;font-size:13px}
table.g th,table.g td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
table.g thead th{position:sticky;top:0;background:var(--tan);z-index:2;font-family:var(--f-mono);font-weight:500;padding:6px 4px;writing-mode:vertical-rl;transform:rotate(180deg);height:96px;text-align:left}
table.g thead th.corner{writing-mode:horizontal-tb;transform:none;left:0;z-index:3;vertical-align:bottom;text-align:left;padding:8px;font-family:var(--f-body);font-weight:600}
table.g tbody th{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;padding:6px 10px;font-weight:400;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
table.g tbody th .tag{font-weight:500;margin-right:6px}
table.g tbody th .sm{color:var(--ink-2)}
table.g td{padding:0;text-align:center}
table.g td button{width:42px;height:34px;border:0;background:none;font-family:var(--f-mono);font-weight:500}
table.g td button.Y{background:var(--fit-bg);color:var(--fit)}
table.g td button.A{background:var(--adp-bg);color:var(--adp)}
table.g td button.N{background:var(--no-bg);color:var(--no)}
table.g td button.U{color:var(--unk)}
table.g td button.S{color:var(--adp);background:repeating-linear-gradient(-45deg,transparent 0 5px,var(--adp-bg) 5px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2);margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* yard walk */
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:16px}
.card h3{font-size:21px;font-weight:800;margin-bottom:8px}
.measure svg{width:100%;height:auto}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.steps b{font-weight:600}
.mtable{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.mtable td{border-top:1px solid var(--rule);padding:7px 6px;vertical-align:top}
.mtable td:first-child{font-weight:600;white-space:nowrap;padding-right:12px}
textarea{width:100%;min-height:130px;border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:6px;padding:10px;font-family:var(--f-mono);font-size:12.5px}
.prev{overflow-x:auto;margin-top:10px}
.prev table{border-collapse:collapse;font-size:12.5px}
.prev td,.prev th{border:1px solid var(--rule);padding:4px 8px;white-space:nowrap;text-align:left}
.maprow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}

/* move tab */
.movegrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.movegrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.movegrid>.card:last-child{grid-column:1/-1}}
@media (max-width:700px){.movegrid{grid-template-columns:minmax(0,1fr)}}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--livery);color:#fff;font-size:14px;margin-right:8px;vertical-align:2px}
.pick{display:flex;flex-direction:column;max-height:460px;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;margin-top:10px}
.pitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto 22px;gap:10px;align-items:center;text-align:left;background:var(--panel);border:0;border-top:1px solid var(--rule);padding:8px 10px}
.pitem:first-child{border-top:0}
.pitem[aria-pressed="true"]{background:var(--tan)}
.pico{width:44px;height:34px;display:grid;place-items:center}
.pico svg{width:44px;height:34px}
.pt{display:flex;flex-direction:column;min-width:0}
.pt span{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ploc{font-size:12.5px;color:var(--ink-2);text-align:right;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick{width:20px;height:20px;border:2px solid var(--rule);border-radius:5px}
.pitem[aria-pressed="true"] .tick{background:var(--livery);border-color:var(--livery);box-shadow:inset 0 0 0 3px var(--tan)}
.sitepick{display:flex;flex-direction:column;gap:6px}
.sitebtn{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:11px 12px;font-weight:600}
.sitebtn svg{width:15px;height:15px;color:var(--ink-2);flex:none}
.sitebtn[aria-pressed="true"]{background:var(--livery);color:#fff;border-color:var(--livery)}
.sitebtn[aria-pressed="true"] svg{color:var(--tan)}
.summary{margin:14px 0 10px;font-size:15px}
.btn.big{width:100%;justify-content:center;padding:13px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mlist{display:flex;flex-direction:column}
.mrow2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.mrow2:first-child{border-top:0}
/* photo checklist */
.prog{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--livery)}
.phrow{grid-template-columns:64px minmax(0,1fr) auto}
.phthumb{width:64px;height:48px;border-radius:6px;background:var(--tan);overflow:hidden;display:grid;place-items:center}
.phthumb img{width:100%;height:100%;object-fit:cover}
.phthumb svg{width:56px;height:42px}
.phrow label.btn{position:relative}
.phrow label.btn input{position:absolute;width:1px;height:1px;opacity:0}
.group>h4 svg{color:var(--ink-2)}
/* fit tree */
.treepick{display:flex;align-items:center;gap:8px;min-width:0}
.treepick select{max-width:min(420px,70vw);font-weight:600}
.legend2{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--ink-2);margin-bottom:16px}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:22px;height:14px;border-radius:3px;background:var(--panel);border:2px solid var(--livery)}
.lg.dash{border-style:dashed;border-color:var(--ink-2)}
.lg.here{background:var(--tan);border-color:var(--tan-2)}
.treewrap{overflow-x:auto;padding-bottom:8px}
.tree{display:flex;flex-direction:column;align-items:center;min-width:min-content}
.rootnode{display:flex;gap:16px;align-items:center;background:var(--livery);color:#fff;border-radius:12px;padding:12px 18px 12px 12px;position:relative;max-width:100%}
.rootnode::after{content:"";position:absolute;left:50%;bottom:-22px;height:22px;border-left:2px solid var(--rule)}
.rart{width:150px;flex:none;background:var(--tan);border-radius:8px;padding:8px 6px 2px;overflow:hidden}
.rart .iron{width:100%;height:auto;display:block}
.rart img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.rinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.rinfo b{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.rinfo span{color:#D9E3DC;font-size:14px}
.rloc{display:flex;gap:5px;align-items:center;font-weight:600;color:#fff!important}
.rloc svg{width:14px;height:14px;color:var(--tan)}
.rsum{margin-top:4px;color:var(--tan)!important;font-weight:600;font-size:13px!important}
.branches{display:flex;gap:0;margin-top:22px;align-items:flex-start}
.branch{position:relative;padding:22px 8px 0;flex:0 1 250px;min-width:210px;display:flex;flex-direction:column;align-items:stretch}
.branch::before,.branch::after{content:"";position:absolute;top:0;width:50%;height:22px;border-top:2px solid var(--rule)}
.branch::before{right:50%}
.branch::after{left:50%;border-left:2px solid var(--rule)}
.branch:first-child::before,.branch:last-child::after{border-top:0}
.branch:only-child::after{border-top:0}
.bhead{align-self:center;background:var(--panel);border:2px solid var(--livery);border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px;position:relative;margin-bottom:12px;white-space:nowrap}
.bhead span{color:var(--ink-2);font-weight:600;margin-left:4px}
.leaves{display:flex;flex-direction:column;gap:8px;position:relative;padding-left:14px}
.leaves::before{content:"";position:absolute;left:4px;top:-12px;bottom:22px;border-left:2px solid var(--rule)}
.leaf{position:relative;display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--livery);border-radius:9px;padding:7px 9px;min-width:0}
.leaf::before{content:"";position:absolute;left:-12px;top:50%;width:10px;border-top:2px solid var(--rule)}
.leaf.poss{border-style:dashed;border-color:var(--ink-2)}
.leaf.same{background:var(--tan);border-color:var(--tan-2)}
.leaf.same.poss{border-color:var(--ink-2)}
.leaf:hover{box-shadow:0 0 0 2px var(--brand)}
.lph{width:44px;height:36px;flex:none;border-radius:5px;overflow:hidden;display:grid;place-items:center;background:var(--panel-2)}
.leaf.same .lph{background:var(--panel)}
.lph img{width:100%;height:100%;object-fit:cover}
.lph svg{width:40px;height:32px}
.lt{display:flex;flex-direction:column;min-width:0}
.ltag{font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center}
.ltag em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:3px;padding:0 4px}
.lw{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lloc{display:flex;gap:4px;align-items:center;font-size:12.5px;font-weight:600}
.lloc svg{width:12px;height:12px;flex:none;color:var(--ink-2)}
.tempty{margin-top:22px;padding:16px;border:2px dashed var(--rule);border-radius:10px;color:var(--ink-2);max-width:480px;text-align:center}
@media (max-width:760px){
 .tree{align-items:stretch}
 .rootnode{flex-direction:column;align-items:flex-start}
 .rart{width:100%}
 .rootnode::after{left:22px}
 .branches{flex-direction:column;padding-left:20px;margin-top:22px;border-left:2px solid var(--rule);margin-left:21px}
 .branch{padding:12px 0 0;flex:none;min-width:0}
 .branch::before,.branch::after{display:none}
 .bhead{align-self:flex-start;margin-left:-8px}
 .bhead::before{content:"";position:absolute;left:-14px;top:50%;width:12px;border-top:2px solid var(--rule)}
}
/* mark fits */
.mfhead{display:flex;gap:14px;align-items:center}
.mfm{width:120px;flex:none;background:var(--tan);border-radius:8px;padding:6px 4px 0}
.mfm .iron{width:100%;height:auto;display:block}
.mfpick{max-height:none}
.mfsec{position:sticky;top:0;z-index:1;background:var(--panel-2);padding:6px 10px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.pitem.chg{box-shadow:inset 4px 0 0 var(--maroon)}
.mfbar{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;background:var(--panel);border-top:1px solid var(--rule);margin:12px -16px -16px;padding:12px 16px;border-radius:0 0 8px 8px}
.mfbar>span{margin-right:auto}
@media (max-width:500px){.mfm{width:84px}}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--panel-2);border-radius:8px;padding:8px 10px;margin:10px 0}
.linkbox code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px;user-select:all}
/* moves */
.moves{display:flex;flex-direction:column}
.mrow{padding:10px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.mrow:first-child{border-top:0}
.mt{display:flex;gap:8px;align-items:baseline}
.mpath{font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* empty */
.empty{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:24px;align-items:center;background:var(--panel);border:2px dashed var(--rule);border-radius:10px;padding:24px}
@media (max-width:700px){.empty{grid-template-columns:minmax(0,1fr)}}
.empty .iron{width:100%;height:auto;opacity:.9}
.empty h3{font-size:26px;font-weight:800;margin-bottom:6px}
.empty p{margin:0 0 12px;max-width:55ch;color:var(--ink-2)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.55);display:flex;justify-content:flex-end}
.sheet-panel{background:var(--panel);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 18px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sheet-panel h3{font-size:26px;font-weight:800}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 10px;margin-top:12px}
.form .gh{grid-column:1/-1;font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--rule);padding-top:8px}
.fld{display:flex;flex-direction:column;gap:3px;grid-column:span 3;min-width:0}
.fld.w2{grid-column:span 2} .fld.w6{grid-column:1/-1}
@media (max-width:480px){.fld,.fld.w2{grid-column:span 3}.fld.w6{grid-column:1/-1}}
.fld span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld em{font-style:normal;font-weight:400;font-family:var(--f-mono);font-size:11.5px}
.fld input,.fld select{border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:5px;padding:8px 9px;font:inherit;width:100%;min-width:0}
.formbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.fitlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fitlist .r{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:6px}
.fitlist .r .l{min-width:0}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;font-size:12px}
.fitlist .r .l small{display:block;color:var(--ink-2);font-size:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:6px;font-weight:600;z-index:60;font-size:14px}

/* iron (svg) */
.iron .body{fill:var(--iron)} .iron .body2{fill:var(--iron-2)} .iron .stripe{fill:var(--cream)} .iron .dk{fill:var(--steel)} .iron .trk{fill:var(--steel)} .iron .trk-in{fill:var(--steel-2)} .iron .roll{fill:var(--steel)} .iron .glass{fill:var(--glass)}
.iron .cyl{stroke:#C9CED2;stroke-width:5;stroke-linecap:round} .iron .tool{fill:var(--steel-2);stroke:var(--steel);stroke-width:2} .iron .shadow{fill:var(--ink);opacity:.12}
.ico .s{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round} .ico .f{fill:currentColor}
@media (prefers-reduced-motion:no-preference){.mcard,.acard,.chip,.seg button{transition:border-color .15s,background .15s}}
</style>

function suggest(a,m){
 const am=String(a.mount||"").toLowerCase(), mc=String(m.coupler||"").toLowerCase();
 const pinOn=!am||am.includes("pin");
 const ad=num(a.pinDia),md=num(m.pinDia),ac=num(a.pinCC),mcc=num(m.pinCC);
 if(pinOn&&(!mc||mc.includes("pin"))&&ad!=null&&md!=null&&ac!=null&&mcc!=null&&Math.abs(ad-md)<=1&&Math.abs(ac-mcc)<=5)return"Pins measure the same";
 if(am&&mc&&!am.includes("pin")&&!mc.includes("pin")&&(am.includes(mc)||mc.includes(am)))return"Same coupler";
 return"";
}
function warnings(a,m){

 if(kind(a.type)==="thumb"&&m.thumb==="Y")w.push("Machine already has a thumb");
 return w;
}

const CLASS_ORDER=["Mini","Compact","Mid-size","Large","Heavy"];
function descClass(d){d=String(d||"").toUpperCase().replace(/\s+/g," ");
 const rules=[[/PC1000|PC650|PC800|CAT 37\d|CAT 39\d/,"XL"],[/PC490|PC450|CAT 349|CAT 352/,"Heavy"],[/PC400|PC360|PC300|CAT 33[05]|\b33[05]\b/,"Large"],[/PC2[0-9]{2}|PW170|CAT 3[12][05]|300L|320L?|M315|JD ?180|\b180[CG]?\b/,"Mid-size"],[/PC1[0-9]{2}|JD ?135|\b135[GP]?\b/,"Compact"],[/PC88|PC78|\b8[05]G\b/,"Small"],[/PC50|PC35|PC55|303\.5|\b30[0-5]\b/,"Mini"]];
 for(const[re,c]of rules)if(re.test(d))return c;return""}
function machineClass(m){return descClass([m.make==="Cat"?"CAT":m.make,m.model].join(" "))||mSize(m).k}
function hammerFits(lb,cls){const r={"Mini":[0,700],"Compact":[600,1700],"Mid-size":[1200,3200],"Large":[2500,5500],"Heavy":[4000,99999]}[cls];return r&&lb>=r[0]&&lb<=r[1]}
function mightFit(a,m){
 if(works(a,m.id))return false;if(!/excavator/i.test(m.mtype||"Excavator"))return false;
 const mc=machineClass(m);const hc=mc==="Small"?"Compact":mc==="XL"?"Heavy":mc;if(!CLASS_ORDER.includes(hc))return false;const k=kind(a.type);
 if(k==="hammer"){const lb=num(a.weight);return lb!=null&&hammerFits(lb,hc)}
 if(!["bucket","rake","grapple","cracker","vibro","ripper","thumb","plate"].includes(k))return false;
 const ac=descClass(a.desc);return!!ac&&ac===mc;
}
const GRP_LABEL={bucket:"Buckets",lbucket:"Loader buckets",hammer:"Hammers",forks:"Forks & arms",other:"Other"};
function leaf(a,m,poss){
 const same=a.location&&a.location===m.location;const size=sizeLine(a);const src=photoSrc(a);const fb=fitBy(a,m.id);
 return `<button class="leaf${poss?" poss":""}${same?" same":""}" data-act="editA" data-id="${a.id}"><span class="lph">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:icon(kind(a.type))}</span><span class="lt"><span class="ltag">${esc(a.tag)}${poss?`<em>check</em>`:fb&&fb.src==="list"?`<em>check</em>`:""}</span><span class="lw">${esc(a.type||"")}${size?" · "+esc(size):""}</span><span class="lloc">${PIN}${same?"Same site":esc(a.location||"No site")}</span></span></button>`;
}

 const showPoss=S.treePoss!==false;
 const bySite={};S.machines.forEach(x=>{const k=x.location||"No site";(bySite[k]=bySite[k]||[]).push(x)});
 const opts=Object.keys(bySite).sort().map(site=>`<optgroup label="${esc(site)}">${bySite[site].map(x=>`<option value="${x.id}" ${x.id===m.id?"selected":""}>${esc(mLabel(x))} — ${esc([x.make,x.model].filter(Boolean).join(" "))}</option>`).join("")}</optgroup>`).join("");
 const yes=S.atts.filter(a=>works(a,m.id)),poss=showPoss?S.atts.filter(a=>mightFit(a,m)):[];
 const order=["bucket","lbucket","hammer","forks","other"];const groups={};
 for(const a of yes)(groups[grp(kind(a.type))]=groups[grp(kind(a.type))]||{y:[],p:[]}).y.push(a);
 for(const a of poss)(groups[grp(kind(a.type))]=groups[grp(kind(a.type))]||{y:[],p:[]}).p.push(a);
 const sortL=arr=>arr.sort((a,b)=>((b.location===m.location)-(a.location===m.location))||String(a.location||"").localeCompare(String(b.location||""))||String(a.tag).localeCompare(String(b.tag),undefined,{numeric:true}));

 let h=`<div class="pickbar"><h2>Fit tree</h2><label class="treepick"><span class="note">Machine</span><select class="f" id="treeM" aria-label="Machine">${opts}</select></label></div>
 <div class="legend2"><span><i class="lg solid"></i>Works with it</span><span><i class="lg dash"></i>Might fit — same size, check before using</span><span><i class="lg here"></i>At the same site</span><button class="chip" data-act="treePoss" aria-pressed="${showPoss}">${showPoss?"Showing":"Show"} might-fit</button>${S.canWrite||S.demo?`<button class="btn small primary" data-act="toMark" data-id="${m.id}">Mark fits for ${esc(mLabel(m))}</button>`:""}</div>
 <div class="treewrap"><div class="tree"><div class="rootnode"><div class="rart">${photoSrc(m)?`<img src="${esc(photoSrc(m))}" alt="">`:machineArt(m,"bucket",1)}</div><div class="rinfo"><b>${esc(mLabel(m))}</b><span>${esc([m.make,m.model].filter(Boolean).join(" "))} · ${esc(m.mtype||"Excavator")}</span><span class="rloc">${PIN}${esc(m.location||"No site")}</span><span class="rsum">${yes.length} work with it${poss.length?` · ${poss.length} might fit`:""} · ${here} at this site</span></div></div>`;
 const keys=order.filter(k=>groups[k]);
 if(!keys.length)h+=`<div class="tempty">Nothing marked for this machine yet. Open an attachment and tick the machines it works with, or use Manage → Fit grid.</div>`;
 else h+=`<div class="branches">${keys.map(k=>{const g=groups[k];return`<div class="branch"><div class="bhead">${GRP_LABEL[k]} <span>${g.y.length+g.p.length}</span></div><div class="leaves">${sortL(g.y).map(a=>leaf(a,m,false)).join("")}${sortL(g.p).map(a=>leaf(a,m,true)).join("")}</div></div>`}).join("")}</div>`;
 return h+`</div></div>`;
}

function vMarkFits(){

 const{m,st}=x;const can=S.canWrite||S.demo;const q=(st.q||"").toLowerCase();
 const bySite={};S.machines.forEach(y=>{const k=y.location||"No site";(bySite[k]=bySite[k]||[]).push(y)});
 const opts=Object.keys(bySite).sort().map(site=>`<optgroup label="${esc(site)}">${bySite[site].map(y=>`<option value="${y.id}" ${y.id===m.id?"selected":""}>${esc(mLabel(y))} — ${esc([y.make,y.model].filter(Boolean).join(" "))}</option>`).join("")}</optgroup>`).join("");
 const nChg=Object.keys(st.changes).length;
 let list=S.atts.filter(a=>(st.f==="all"||grp(kind(a.type))===st.f)&&(!q||[a.tag,a.desc,a.type,a.location].join(" ").toLowerCase().includes(q)));
 const rank=a=>works(a,m.id)?0:mightFit(a,m)?1:2;
 list.sort((a,b)=>rank(a)-rank(b)||String(a.tag).localeCompare(String(b.tag),undefined,{numeric:true}));
 const groups=new Set(S.atts.map(a=>grp(kind(a.type))));
 const sec={0:"Marked as working",1:"Might fit — check these first",2:"Everything else"};let last=-1;
 let h=`<div class="card mf"><div class="mfhead"><div class="mfm">${machineArt(m,"bucket",1)}</div><div style="min-width:0;flex:1"><label class="fld"><span>Machine</span><select id="mfM" class="f">${opts}</select></label><p class="note" style="margin:6px 0 0">Tick every attachment that works on <b>${esc(mLabel(m))}</b>, then Save.</p></div></div>
 <div class="tools" style="margin-top:12px"><input class="search" id="mfQ" type="search" placeholder="Search ID, description, site" value="${esc(st.q||"")}" aria-label="Search attachments"></div>
 <div class="chips">${FILTERS.filter(([k])=>k==="all"||groups.has(k)).map(([k,l])=>`<button class="chip" data-act="mfF" data-f="${k}" aria-pressed="${st.f===k}">${l}</button>`).join("")}</div>
 <div class="pick mfpick">`;
 for(const a of list){const rk=rank(a);if(rk!==last){h+=`<div class="mfsec">${sec[rk]}</div>`;last=rk}
  const on=mfOn(a,m),chg=a.id in st.changes;
  h+=`<button class="pitem${chg?" chg":""}" data-act="mfTick" data-id="${a.id}" aria-pressed="${on}" ${can?"":"disabled"}><span class="pico">${photoSrc(a)?`<img src="${esc(photoSrc(a))}" alt="" style="width:44px;height:34px;object-fit:cover;border-radius:4px">`:icon(kind(a.type))}</span><span class="pt"><b>${esc(a.tag)}</b><span>${esc(a.desc||a.type||"")}</span></span><span class="ploc">${esc(a.location||"No site")}</span><span class="tick" aria-hidden="true"></span></button>`}
 if(!list.length)h+=`<p class="note" style="padding:10px">Nothing matches.</p>`;
 h+=`</div><div class="mfbar"><span>${nChg?`<b>${nChg} change${nChg===1?"":"s"}</b> not saved yet`:"No changes yet"}</span>${can?`<button class="btn ghost" data-act="mfReset" ${nChg?"":"disabled"}>Undo changes</button><button class="btn primary" data-act="mfSave" ${nChg?"":"disabled"}>Save</button>`:`<span class="note">You need edit access to mark fits.</span>`}</div></div>`;
 return h;
}
async function mfSave(){

/* ---------- import ---------- */
function parseTable(t){
 const lines=t.replace(/\r/g,"").split("\n").filter(l=>l.trim());if(lines.length<2)return null;
 const d=lines[0].includes("\t")?"\t":",";
 const split=l=>{if(d==="\t")return l.split("\t").map(s=>s.trim());const out=[];let cur="",q=false;for(const ch of l){if(ch==='"'){q=!q}else if(ch===","&&!q){out.push(cur.trim());cur=""}else cur+=ch}out.push(cur.trim());return out};
 return{head:split(lines[0]),rows:lines.slice(1).map(split)};
}
const MAPS={atts:[["tag","ID",/asset.?(#|no|num|id)|^id$|number|tag|equip.*(#|id)/i],["desc","Description",/name|desc/i],["type","Type",/categ|type|class/i],["make","Make",/make|manuf|brand/i],["model","Model",/model|serial/i],["location","Location",/locat|site|job|yard/i]],
 machines:[["unit","Unit #",/asset.?(#|no|num|id)|^id$|unit|number|equip.*(#|id)/i],["make","Make",/make|manuf|brand/i],["model","Model",/model/i],["weight","Weight (lb)",/weight/i],["location","Location",/locat|site|job/i]]};
function autoMap(kind,head){const used=new Set();const m={};for(const[k,,re]of MAPS[kind]){const i=head.findIndex((h,ix)=>!used.has(ix)&&re.test(h));if(i>=0){m[k]=i;used.add(i)}}return m}
function renderImportPreview(){
 const box=$("#impPrev");if(!box)return;const imp=S.imp;const p=imp&&imp.text?parseTable(imp.text):null;
 if(!p){box.innerHTML=imp&&imp.text?`<p class="note">Need a header row plus at least one data row.</p>`:"";return}
 if(!imp.map||imp.headKey!==p.head.join("|")){imp.map=autoMap(imp.kind,p.head);imp.headKey=p.head.join("|")}
 const opts=i=>`<option value="">—</option>`+p.head.map((h,ix)=>`<option value="${ix}" ${String(i)===String(ix)?"selected":""}>${esc(h||"Column "+(ix+1))}</option>`).join("");
 const idK=imp.kind==="atts"?"tag":"unit";const existing=new Set((imp.kind==="atts"?S.atts.map(a=>a.tag):S.machines.map(m=>m.unit)).map(x=>String(x).trim().toLowerCase()));
 const rows=p.rows.filter(r=>imp.map[idK]!=null&&r[imp.map[idK]]);const fresh=rows.filter(r=>!existing.has(String(r[imp.map[idK]]).trim().toLowerCase()));
 box.innerHTML=`<div class="maprow">${MAPS[imp.kind].map(([k,l])=>`<label class="fld" style="grid-column:auto"><span>${l}</span><select id="map_${k}" data-mk="${k}">${opts(imp.map[k])}</select></label>`).join("")}</div>
 <div class="prev"><table><tr>${MAPS[imp.kind].map(([,l])=>`<th>${l}</th>`).join("")}</tr>${rows.slice(0,5).map(r=>`<tr>${MAPS[imp.kind].map(([k])=>`<td>${esc(imp.map[k]!=null?r[imp.map[k]]:"")}</td>`).join("")}</tr>`).join("")}</table></div>
 <p class="note">${rows.length} rows with an ID · ${fresh.length} new · ${rows.length-fresh.length} already on the list (skipped)</p>
 <div class="formbar">${S.canWrite&&!S.dbMissing?`<button class="btn primary" data-act="doImport" ${fresh.length&&!imp.busy?"":"disabled"}>${imp.busy?"Importing "+imp.done+" of "+fresh.length+"…":"Import "+fresh.length+" "+(imp.kind==="atts"?"attachments":"machines")}</button>`:""}<button class="btn ghost" data-act="impClear">Clear</button></div>`;
}
async function doImport(){
 const imp=S.imp;const p=parseTable(imp.text);if(!p||imp.busy)return;
 const idK=imp.kind==="atts"?"tag":"unit";const existing=new Set((imp.kind==="atts"?S.atts.map(a=>a.tag):S.machines.map(m=>m.unit)).map(x=>String(x).trim().toLowerCase()));
 const rows=p.rows.filter(r=>imp.map[idK]!=null&&r[imp.map[idK]]&&!existing.has(String(r[imp.map[idK]]).trim().toLowerCase()));
 imp.busy=true;imp.done=0;renderImportPreview();const col=S.db.collection(imp.kind==="atts"?"attachments":"machines");
 for(const r of rows){const doc={};for(const[k]of MAPS[imp.kind]){if(imp.map[k]!=null)doc[k]=String(r[imp.map[k]]??"").trim()}
  if(imp.kind==="atts"){doc.type=TYPES.includes(doc.type)?doc.type:(guessType((doc.type||"")+" "+(doc.desc||""))||"");doc.inTenna="Y";doc.fits={}}
  try{await col.add(doc)}catch(e){writeFail(e);break}imp.done++;if(imp.done%5===0)renderImportPreview()}
 imp.busy=false;toast(`Imported ${imp.done}`);S.imp={kind:imp.kind,text:""};render();
}

 const photo=`<div class="photo"><div class="ph" id="phPrev">${src?`<img src="${esc(src)}" alt="">`:icon(kind(v.type))}</div>${can&&S.assets&&!S.demo?`<label class="btn small">${src?"Replace photo":"Add photo"}<input type="file" id="phFile" accept="image/*"></label>`:can&&!S.demo?`<span class="note">Photos can be added by people with edit access.</span>`:""}</div>`;
 let fits="";if(a&&S.machines.length){fits=`<div class="gh" style="margin-top:18px;font-family:var(--f-disp);font-weight:700;color:var(--ink-2);border-bottom:1px solid var(--rule)">Works with</div><div class="fitlist">${S.machines.map(m=>{const w=works(a,m.id);const fb=fitBy(a,m.id);const chk=fb&&fb.src==="list"&&w;return`<div class="r"><div class="l"><span class="mono">${esc(mLabel(m))}</span> <span class="note">${esc([m.make,m.model].filter(Boolean).join(" "))}</span>${chk?`<small>From the equipment list — check it fits${can&&!S.demo?` · <button class="linkbtn" data-act="confirmFit" data-a="${a.id}" data-m="${m.id}">Confirmed</button>`:""}</small>`:""}</div>${can?`<button class="works" data-act="fit" data-a="${a.id}" data-m="${m.id}" aria-pressed="${w}">${w?"✓ Works":"Not marked"}</button>`:`<span class="pill ${w?"Y":"unk"}">${w?"✓":"—"}</span>`}</div>`}).join("")}</div>`}
 openSheet(`<h3>${a?esc(a.tag):"Add attachment"}</h3>${photo}${fits}${formHTML(A_FIELDS,v)}<div class="formbar">${S.canWrite||S.demo?`<button class="btn primary" data-act="saveA" data-id="${a?a.id:""}">Save</button>`:""}<button class="btn ghost" data-act="close">${S.canWrite?"Cancel":"Close"}</button>${a&&S.canWrite&&!S.demo?`<button class="btn danger" data-act="delA" data-id="${a.id}" style="margin-left:auto">Delete</button>`:""}</div>`);
}
async function shrink(file){
 try{const bmp=await createImageBitmap(file);const k=Math.min(1,1400/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82))}catch(e){return file}
}

async function saveM(id){
 if(S.demo){toast("Sample preview — nothing is saved");closeSheet();return}
 const o=collect(M_FIELDS);if(!o.unit){toast("Add a unit number first");$("#f_unit").focus();return}
 if(S.machines.some(m=>m.id!==id&&String(m.unit).toLowerCase()===o.unit.toLowerCase())){toast(o.unit+" is already on the list");return}
 try{if(S.pending&&S.assets){try{const up=await S.assets.upload(S.pending);o.photo=up.id}catch(e){toast("Photo didn't upload. The rest was saved.")}}
  await ensureSite(o.location);if(id)await S.db.doc("machines/"+id).update(o);else{const r=await S.db.collection("machines").add(o);S.sel=r.id}S.pending=null;closeSheet();toast("Saved "+o.unit)}catch(e){writeFail(e)}
}
async function saveA(id){
 if(S.demo){toast("Sample preview — nothing is saved");closeSheet();return}
 const o=collect(A_FIELDS);if(!o.tag){toast("Add an ID first");$("#f_tag").focus();return}
 if(S.atts.some(a=>a.id!==id&&String(a.tag).toLowerCase()===o.tag.toLowerCase())){toast(o.tag+" is already on the list");return}
 const btn=document.querySelector('[data-act="saveA"]');if(btn){btn.disabled=true;btn.textContent="Saving…"}
 try{
  if(S.pending&&S.assets){try{const up=await S.assets.upload(S.pending);o.photo=up.id}catch(e){toast("Photo didn't upload. The rest was saved.")}}
  await ensureSite(o.location);if(id)await S.db.doc("attachments/"+id).update(o);else await S.db.collection("attachments").add({...o,inTenna:o.tag.startsWith("UT")?"N":"Y",fits:{}});
  S.pending=null;closeSheet();toast("Saved "+o.tag)
 }catch(e){writeFail(e);if(btn){btn.disabled=false;btn.textContent="Save"}}
}

async function del(path,btn,label){
 if(S.demo){toast("Sample preview — nothing is saved");closeSheet();return}
 if(btn.dataset.armed!=="1"){btn.dataset.armed="1";btn.textContent="Tap again to delete";setTimeout(()=>{if(btn.isConnected){btn.dataset.armed="";btn.textContent="Delete"}},4000);return}
 try{await S.db.doc(path).delete();closeSheet();toast("Deleted "+label)}catch(e){writeFail(e)}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act],nav.tabs button");if(!b)return;
 if(b.matches("nav.tabs button")){S.tab=b.dataset.tab;try{localStorage.setItem("af_tab",S.tab)}catch(_){}render();return}
 const d=b.dataset;
 switch(d.act){
  case"go":if(d.to==="import"){S.tab="manage";S.ysub="import"}else S.tab=d.to;try{localStorage.setItem("af_tab",S.tab)}catch(_){}render();break;
  case"openM":S.sel=d.id;S.open=true;S.filter="all";try{localStorage.setItem("af_sel",S.sel)}catch(_){}render();window.scrollTo(0,0);break;
  case"home":S.open=false;render();window.scrollTo(0,0);break;
  case"filter":S.filter=d.f;render();break;
  case"fit":{setFit(d.a,d.m);const a=S.atts.find(x=>x.id===d.a);const w=works(a,d.m);b.setAttribute("aria-pressed",String(w));b.textContent=w?"✓ Works":"Not marked";break}
  case"cycle":setFit(d.a,d.m);break;
  case"addM":sheetMachine(null);break;
  case"editM":sheetMachine(S.machines.find(m=>m.id===d.id));break;
  case"addA":sheetAtt(null,{inTenna:"Y"});break;
  case"addUT":sheetAtt(null,{tag:nextUT(),inTenna:"N"});break;
  case"editA":sheetAtt(S.atts.find(a=>a.id===d.id));break;
  case"saveM":saveM(d.id);break;
  case"saveA":saveA(d.id);break;
  case"delM":del("machines/"+d.id,b,"machine");if(b.dataset.armed!=="1"&&S.sel===d.id)S.sel=null;break;
  case"delA":del("attachments/"+d.id,b,"attachment");break;
  case"close":closeSheet();break;
  case"impKind":S.imp={kind:d.k,text:S.imp?.text||""};render();break;
  case"impClear":S.imp={kind:S.imp?.kind||"atts",text:""};render();break;
  case"ysub":S.ysub=d.k;render();break;
  case"mtypeF":S.mtypeF=d.v;render();break;
  case"confirmFit":confirmFit(d.a,d.m,b);break;
  case"mfTick":{const x=mfState();const a=S.atts.find(y=>y.id===d.id);if(!x||!a)break;const cur=mfOn(a,x.m),orig=works(a,x.m.id);if(!cur===orig)delete x.st.changes[a.id];else x.st.changes[a.id]=!cur;b.setAttribute("aria-pressed",String(!cur));b.classList.toggle("chg",a.id in x.st.changes);const bar=document.querySelector(".mfbar");if(bar){const n=Object.keys(x.st.changes).length;bar.querySelector("span").innerHTML=n?`<b>${n} change${n===1?"":"s"}</b> not saved yet`:"No changes yet";bar.querySelectorAll("button").forEach(bt=>bt.disabled=!n)}break}
  case"mfF":S.mf.f=d.f;render();break;
  case"mfReset":S.mf.changes={};render();break;
  case"mfSave":mfSave();break;
  case"toMark":S.mf={mid:d.id,changes:{},q:"",f:"all"};S.tab="manage";S.ysub="fits";render();window.scrollTo(0,0);break;
  case"toTree":S.treeM=d.id;S.tab="tree";render();window.scrollTo(0,0);break;
  case"treePoss":S.treePoss=!S.treePoss;render();break;
  case"copyCrew":{const t=CREW_URL;Promise.resolve().then(()=>navigator.clipboard.writeText(t)).then(()=>toast("Crew link copied")).catch(()=>{const el=document.getElementById("crewUrl");const rg=document.createRange();rg.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);toast("Link selected — copy it")});break}
  case"phAll":S.phAll=!!d.v;render();break;
  case"mvKind":S.mvKind=d.k;render();break;
  case"mvPick":{S.mvSel=S.mvSel||new Set();S.mvSel.has(d.k)?S.mvSel.delete(d.k):S.mvSel.add(d.k);const sc=document.querySelector(".pick")?.scrollTop;render();const p=document.querySelector(".pick");if(p&&sc!=null)p.scrollTop=sc;break}
  case"mvSite":S.mvSite=S.mvSite===d.n?"":d.n;{const sc=document.querySelector(".pick")?.scrollTop;render();const p=document.querySelector(".pick");if(p&&sc!=null)p.scrollTop=sc}break;
  case"mvClear":S.mvSel=new Set();render();break;
  case"doMove":doMove();break;
  case"addSite":addSite($("#nsName").value,$("#nsAddr").value,$("#nsJob").value);break;
  case"adoptSite":addSite(d.n,"");break;
  case"editSite":sheetSite((S.siteDocs||[]).find(x=>x.id===d.id));break;
  case"saveSite":saveSite(d.id);break;
  case"toggleSite":toggleSite(d.id);break;
  case"doImport":if(S.demo){toast("Exit the sample preview first");break}doImport();break;
  case"demoOn":setDemo(true);break;
  case"demoOff":setDemo(false);break;
 }
});
document.addEventListener("input",e=>{
 if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
 if(e.target.id==="mvNote")S.mvNote=e.target.value;
 if(e.target.id==="mfQ"&&S.mf){S.mf.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#mfQ");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
 if(e.target.id==="mvQ"){S.mvQ=e.target.value;const pos=e.target.selectionStart;render();const q=$("#mvQ");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
 if(e.target.id==="impText"){S.imp={kind:S.imp?.kind||"atts",text:e.target.value};renderImportPreview()}
});
document.addEventListener("change",async e=>{
 if(e.target.id==="mfM"){if(S.mf&&Object.keys(S.mf.changes).length&&!S.mfWarned){S.mfWarned=true;e.target.value=S.mf.mid;toast("Save or undo your changes first");return}S.mfWarned=false;S.mf={mid:e.target.value,changes:{},q:S.mf?.q||"",f:"all"};render();return}
 if(e.target.id==="treeM"){S.treeM=e.target.value;render();return}
 if(e.target.classList&&e.target.classList.contains("phquick")){quickPhoto(e.target);return}

 if(e.target.id==="phFile"&&e.target.files[0]){const blob=await shrink(e.target.files[0]);S.pending=blob;const u=URL.createObjectURL(blob);$("#phPrev").innerHTML=`<img src="${u}" alt="">`;toast("Photo ready — tap Save")}
 if(e.target.id==="tfilter"){S.tfilter=e.target.value;render()}
 if(e.target.id==="mloc"){S.mloc=e.target.value;render()}
 if(e.target.dataset.mk&&S.imp){S.imp.map[e.target.dataset.mk]=e.target.value===""?null:+e.target.value;renderImportPreview()}
});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});
boot();
</script>
</body></html>
